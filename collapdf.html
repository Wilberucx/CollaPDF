<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CollaPDF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Archivo+Black&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #0c0c0c;
  --surface:   #141414;
  --surface2:  #1c1c1c;
  --border:    #282828;
  --border2:   #333;
  --text:      #e0ddd5;
  --muted:     #666;
  --accent:    #f0a030;
  --accent-dim:#7a5010;
  --danger:    #e05050;
  --green:     #50d090;
  --radius:    5px;
}

body {
  font-family: 'Archivo', sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  font-size: 13px;
}

/* ── HEADER ── */
.header {
  display: flex;
  align-items: center;
  padding: 0 16px;
  height: 48px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  gap: 12px;
  flex-shrink: 0;
  position: relative;
}
.logo {
  font-family: 'Archivo Black', sans-serif;
  font-size: 16px;
  letter-spacing: -0.5px;
  color: var(--text);
}
.logo span { color: var(--accent); }
.logo-sub {
  font-family: 'Space Mono', monospace;
  font-size: 9px;
  color: var(--muted);
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-left: 8px;
  vertical-align: middle;
}
.header-sep { height: 20px; width: 1px; background: var(--border); margin: 0 4px; }
.header-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }

/* ── BUTTONS ── */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  border-radius: var(--radius);
  border: 1px solid transparent;
  cursor: pointer;
  font-family: 'Archivo', sans-serif;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.2px;
  transition: all 0.12s;
  white-space: nowrap;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.btn-accent {
  background: var(--accent);
  color: #0c0c0c;
  border-color: var(--accent);
}
.btn-accent:hover { background: #ffb840; border-color: #ffb840; }
.btn-accent:disabled { background: var(--accent-dim); border-color: var(--accent-dim); color: #666; cursor: not-allowed; }
.btn-ghost {
  background: transparent;
  color: var(--muted);
  border-color: var(--border);
}
.btn-ghost:hover { color: var(--text); border-color: var(--border2); background: var(--surface2); }
.btn-xs { padding: 3px 8px; font-size: 10px; }
.btn-icon {
  padding: 5px;
  background: transparent;
  border: none;
  color: var(--muted);
  cursor: pointer;
  border-radius: 4px;
  transition: all 0.12s;
  line-height: 1;
}
.btn-icon:hover { color: var(--text); background: var(--surface2); }
.btn-icon.danger:hover { color: var(--danger); }

/* ── LAYOUT ── */
.app-body {
  display: flex;
  flex: 1;
  overflow: hidden;
  min-height: 0;
}

/* ── SIDEBAR ── */
.sidebar {
  width: 280px;
  min-width: 280px;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  overflow-x: hidden;
}
.sidebar::-webkit-scrollbar { width: 4px; }
.sidebar::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

.sidebar-top {
  padding: 12px;
  border-bottom: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.sidebar-label {
  font-family: 'Space Mono', monospace;
  font-size: 9px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--muted);
  padding: 10px 12px 4px;
}

/* ── PRESET SETTINGS ── */
.preset-settings {
  display: none;
  padding: 12px;
  background: var(--surface2);
  border-bottom: 1px solid var(--border);
  gap: 8px;
  flex-direction: column;
}
.preset-settings.open { display: flex; }
.preset-row {
  display: flex;
  align-items: center;
  gap: 8px;
}
.preset-row label {
  font-family: 'Space Mono', monospace;
  font-size: 11px;
  width: 80px;
  color: var(--muted);
}
.preset-input {
  flex: 1;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 4px 8px;
  border-radius: var(--radius);
  font-family: 'Space Mono', monospace;
  font-size: 11px;
  outline: none;
  width: 60px;
}
.preset-input:focus { border-color: var(--accent); }
.preset-unit { font-family: 'Space Mono', monospace; font-size: 10px; color: var(--muted); }

/* ── GROUPS ── */
.groups-list {
  display: flex;
  flex-direction: column;
  gap: 0;
  padding: 8px;
  gap: 8px;
}

.group-card {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 6px;
  overflow: hidden;
  transition: border-color 0.15s;
}
.group-card:has(.drop-zone.drag-over) {
  border-color: var(--accent);
}

.group-header {
  display: flex;
  align-items: center;
  padding: 8px 10px;
  gap: 6px;
  background: rgba(255,255,255,0.02);
  border-bottom: 1px solid var(--border);
}
.group-drag-handle {
  color: var(--muted);
  cursor: grab;
  font-size: 14px;
  line-height: 1;
  user-select: none;
}
.group-name-input {
  flex: 1;
  background: transparent;
  border: none;
  color: var(--text);
  font-family: 'Archivo', sans-serif;
  font-size: 12px;
  font-weight: 600;
  outline: none;
  min-width: 0;
}
.group-name-input:focus {
  background: rgba(255,255,255,0.05);
  border-radius: 3px;
  padding: 1px 4px;
}
.group-count {
  font-family: 'Space Mono', monospace;
  font-size: 10px;
  color: var(--muted);
  background: var(--border);
  padding: 1px 5px;
  border-radius: 10px;
  min-width: 20px;
  text-align: center;
}

/* Preset pills */
.preset-pills {
  display: flex;
  gap: 3px;
}
.preset-pill {
  width: 22px;
  height: 20px;
  border-radius: 3px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--muted);
  font-family: 'Space Mono', monospace;
  font-size: 10px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.12s;
  display: flex;
  align-items: center;
  justify-content: center;
}
.preset-pill:hover { border-color: var(--accent); color: var(--accent); }
.preset-pill.active { background: var(--accent); border-color: var(--accent); color: #0c0c0c; }

/* Thumbnails */
.group-thumbs {
  display: flex;
  flex-wrap: wrap;
  gap: 3px;
  padding: 8px;
  min-height: 8px;
}
.thumb-wrap {
  position: relative;
  width: 50px;
  height: 50px;
  flex-shrink: 0;
}
.thumb-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 3px;
  display: block;
}
.thumb-remove {
  display: none;
  position: absolute;
  top: -4px;
  right: -4px;
  width: 14px;
  height: 14px;
  background: var(--danger);
  border-radius: 50%;
  align-items: center;
  justify-content: center;
  font-size: 8px;
  color: #fff;
  cursor: pointer;
  border: none;
  z-index: 3;
  line-height: 1;
}
.thumb-wrap:hover .thumb-remove { display: flex; }

/* Drop zone */
.drop-zone {
  margin: 0 8px 8px;
  border: 1px dashed var(--border2);
  border-radius: 4px;
  padding: 8px;
  text-align: center;
  font-size: 11px;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.15s;
  font-family: 'Space Mono', monospace;
  letter-spacing: 0.5px;
}
.drop-zone:hover, .drop-zone.drag-over {
  border-color: var(--accent);
  color: var(--accent);
  background: rgba(240, 160, 48, 0.05);
}

/* ── PREVIEW AREA ── */
.preview-area {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 24px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
  background: #0a0a0a;
  background-image: 
    radial-gradient(circle at 20% 50%, rgba(240,160,48,0.02) 0%, transparent 50%),
    radial-gradient(circle at 80% 20%, rgba(240,160,48,0.015) 0%, transparent 50%);
}
.preview-area::-webkit-scrollbar { width: 6px; }
.preview-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

.preview-page {
  position: relative;
  background: #ffffff;
  box-shadow: 
    0 0 0 1px rgba(255,255,255,0.06),
    0 8px 48px rgba(0,0,0,0.7),
    0 2px 8px rgba(0,0,0,0.5);
  flex-shrink: 0;
  overflow: hidden;
}
.preview-page-num {
  position: absolute;
  bottom: 6px;
  right: 8px;
  font-family: 'Space Mono', monospace;
  font-size: 8px;
  color: #bbb;
}

.preview-empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  color: var(--muted);
  margin-top: 80px;
  text-align: center;
}
.preview-empty .icon {
  font-size: 48px;
  opacity: 0.15;
}
.preview-empty p {
  font-family: 'Space Mono', monospace;
  font-size: 11px;
  letter-spacing: 1px;
  line-height: 1.8;
}

/* Stats bar */
.stats-bar {
  font-family: 'Space Mono', monospace;
  font-size: 9px;
  color: var(--muted);
  letter-spacing: 1px;
  text-transform: uppercase;
  display: flex;
  gap: 16px;
  padding: 4px 0;
}
.stats-bar span { color: var(--accent); }

/* ── MOBILE TABS ── */
.mob-tabs { display: none; }

@media (max-width: 640px) {
  .header { padding: 0 10px; gap: 6px; height: 44px; }
  .logo-sub { display: none; }
  .stats-bar { display: none; }
  .header-sep { display: none; }

  .mob-tabs {
    display: flex;
    flex-shrink: 0;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .mob-tab {
    flex: 1;
    padding: 11px 8px;
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    background: transparent;
    border: none;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.15s;
  }
  .mob-tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  .app-body { flex-direction: column; }

  .sidebar {
    width: 100% !important;
    min-width: 0 !important;
    border-right: none;
    flex: 1;
    min-height: 0;
  }
  .sidebar.mob-hidden { display: none; }
  .preview-area.mob-hidden { display: none; }

  .preview-area { flex: 1; min-height: 0; padding: 16px 12px; }

  /* Bigger touch targets on mobile */
  .preset-pill { width: 30px; height: 28px; font-size: 12px; }
  .drop-zone { padding: 14px; font-size: 12px; }
  .btn { padding: 8px 12px; }
  .thumb-wrap { width: 60px; height: 60px; }
  .thumb-remove { display: flex !important; width: 18px; height: 18px; font-size: 10px; top: -5px; right: -5px; }

  /* Preview hint badge */
  .preview-hint {
    display: inline-flex !important;
  }
}

/* Dividers in sidebar */
.sidebar-footer {
  margin-top: auto;
  padding: 12px;
  border-top: 1px solid var(--border);
}

/* Settings toggle */
.settings-toggle {
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: 'Space Mono', monospace;
  font-size: 10px;
  color: var(--muted);
  cursor: pointer;
  user-select: none;
  padding: 4px 2px;
}
.settings-toggle:hover { color: var(--text); }
.settings-toggle .arrow { transition: transform 0.2s; }
.settings-toggle.open .arrow { transform: rotate(90deg); }

/* Preview hint (mobile) */
.preview-hint {
  display: none;
  align-items: center;
  justify-content: center;
  gap: 6px;
  background: var(--accent);
  color: #0c0c0c;
  font-family: 'Space Mono', monospace;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1px;
  padding: 8px 14px;
  border-radius: 20px;
  cursor: pointer;
  margin: 8px 12px;
  border: none;
  width: calc(100% - 24px);
  text-transform: uppercase;
}

/* Loader overlay */
.loader {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.75);
  z-index: 100;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 16px;
}
.loader.active { display: flex; }
.loader-text {
  font-family: 'Space Mono', monospace;
  font-size: 12px;
  color: var(--accent);
  letter-spacing: 2px;
  animation: pulse 1.2s ease-in-out infinite;
}
@keyframes pulse { 0%,100% { opacity:0.4; } 50% { opacity:1; } }
.loader-bar {
  width: 200px;
  height: 2px;
  background: var(--border);
  border-radius: 2px;
  overflow: hidden;
}
.loader-progress {
  height: 100%;
  background: var(--accent);
  border-radius: 2px;
  animation: progress 1.5s ease-in-out infinite;
  transform-origin: left;
}
@keyframes progress {
  0% { width: 0%; }
  50% { width: 70%; }
  100% { width: 100%; }
}

input[type=file] { display: none; }
</style>
</head>
<body>

<!-- Loader overlay -->
<div class="loader" id="loader">
  <div class="loader-text">GENERANDO PDF...</div>
  <div class="loader-bar"><div class="loader-progress"></div></div>
</div>

<!-- Header -->
<div class="header">
  <div class="logo">Colla<span>PDF</span><span class="logo-sub">v1.0</span></div>
  <div class="header-sep"></div>
  <div id="statsBar" class="stats-bar">
    <div>grupos: <span id="statGroups">0</span></div>
    <div>imágenes: <span id="statImages">0</span></div>
    <div>páginas: <span id="statPages">—</span></div>
  </div>
  <div class="header-right">
    <button class="btn btn-ghost" onclick="addGroup()">＋ Grupo</button>
    <button class="btn btn-accent" id="exportBtn" onclick="exportPDF()">↓ Exportar PDF</button>
  </div>
</div>

<!-- Mobile tabs -->
<div class="mob-tabs" id="mobTabs">
  <button class="mob-tab active" data-tab="sidebar" onclick="switchTab('sidebar')">⊞ Grupos</button>
  <button class="mob-tab" data-tab="preview" onclick="switchTab('preview')">◻ Preview</button>
</div>

<div class="app-body">
  <!-- Sidebar -->
  <div class="sidebar">
    <!-- Settings -->
    <div style="padding: 10px 12px 0;">
      <div class="settings-toggle" id="settingsToggle" onclick="toggleSettings()">
        <span class="arrow">▶</span>
        <span>CONFIGURAR TAMAÑOS</span>
      </div>
    </div>
    <div class="preset-settings" id="presetSettings">
      <div style="font-family:'Space Mono',monospace; font-size:9px; color:var(--muted); letter-spacing:1.5px; text-transform:uppercase; margin-bottom:4px;">Altura de fila en PDF (pt)</div>
      <div class="preset-row">
        <label>S — Pequeño</label>
        <input class="preset-input" type="number" id="presetS" value="70" min="30" max="300" onchange="updatePreset('S', this.value)">
        <span class="preset-unit">pt</span>
      </div>
      <div class="preset-row">
        <label>M — Mediano</label>
        <input class="preset-input" type="number" id="presetM" value="130" min="30" max="300" onchange="updatePreset('M', this.value)">
        <span class="preset-unit">pt</span>
      </div>
      <div class="preset-row">
        <label>L — Grande</label>
        <input class="preset-input" type="number" id="presetL" value="200" min="30" max="300" onchange="updatePreset('L', this.value)">
        <span class="preset-unit">pt</span>
      </div>
      <div style="margin-top:6px; border-top:1px solid var(--border); padding-top:8px;">
        <div style="font-family:'Space Mono',monospace; font-size:9px; color:var(--muted); letter-spacing:1.5px; text-transform:uppercase; margin-bottom:6px;">Máx. imágenes por fila</div>
        <div class="preset-row">
          <label>S</label>
          <input class="preset-input" type="number" id="maxS" value="8" min="1" max="20" onchange="updateMaxRow('S', this.value)">
          <span class="preset-unit">imgs</span>
        </div>
        <div class="preset-row">
          <label>M</label>
          <input class="preset-input" type="number" id="maxM" value="5" min="1" max="20" onchange="updateMaxRow('M', this.value)">
          <span class="preset-unit">imgs</span>
        </div>
        <div class="preset-row">
          <label>L</label>
          <input class="preset-input" type="number" id="maxL" value="3" min="1" max="20" onchange="updateMaxRow('L', this.value)">
          <span class="preset-unit">imgs</span>
        </div>
      </div>
    </div>

    <div class="sidebar-label">GRUPOS</div>
    <div class="groups-list" id="groupsList"></div>
  </div>

  <!-- Preview -->
  <div class="preview-area" id="previewArea">
    <div class="preview-empty" id="previewEmpty">
      <div class="icon">⬛</div>
      <p>AGREGÁ IMÁGENES<br>A LOS GRUPOS<br>PARA PREVISUALIZAR</p>
    </div>
  </div>
</div>

<input type="file" id="fileInput" multiple accept="image/*">

<script>
// ═══════════════════════════════════════════
//  CONSTANTS
// ═══════════════════════════════════════════
const PDF = { w: 595, h: 842 };
const MARGIN = 20;
const GAP = 4;
const GROUP_GAP = 12;
const USABLE_W = PDF.w - MARGIN * 2;

let PRESETS = { S: 70, M: 130, L: 200 };
let MAX_PER_ROW = { S: 8, M: 5, L: 3 };

// ═══════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════
let groups = [];
let gCounter = 0;
let activeGroupId = null;

// ═══════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════
addGroup();

// ═══════════════════════════════════════════
//  SETTINGS
// ═══════════════════════════════════════════
function toggleSettings() {
  const el = document.getElementById('presetSettings');
  const toggle = document.getElementById('settingsToggle');
  const open = el.classList.toggle('open');
  toggle.classList.toggle('open', open);
}

function updatePreset(key, val) {
  const v = parseInt(val);
  if (!isNaN(v) && v >= 30 && v <= 300) {
    PRESETS[key] = v;
    renderPreview();
  }
}

function updateMaxRow(key, val) {
  const v = parseInt(val);
  if (!isNaN(v) && v >= 1 && v <= 20) {
    MAX_PER_ROW[key] = v;
    renderPreview();
  }
}

// ═══════════════════════════════════════════
//  GROUP MANAGEMENT
// ═══════════════════════════════════════════
function addGroup() {
  gCounter++;
  groups.push({
    id: 'g' + gCounter,
    name: 'Grupo ' + gCounter,
    preset: 'M',
    images: []
  });
  renderSidebar();
  updateStats();
}

function removeGroup(id) {
  if (groups.length === 1) return; // keep at least one
  groups = groups.filter(g => g.id !== id);
  renderSidebar();
  renderPreview();
  updateStats();
}

function setPreset(groupId, preset) {
  const g = groups.find(g => g.id === groupId);
  if (g) { g.preset = preset; renderSidebar(); renderPreview(); }
}

function renameGroup(id, name) {
  const g = groups.find(g => g.id === id);
  if (g) g.name = name;
  updateStats();
}

function removeImage(groupId, imgId) {
  const g = groups.find(g => g.id === groupId);
  if (g) {
    g.images = g.images.filter(i => i.id !== imgId);
    renderSidebar();
    renderPreview();
    updateStats();
  }
}

// ═══════════════════════════════════════════
//  IMAGE LOADING
// ═══════════════════════════════════════════
function openFilePicker(groupId) {
  activeGroupId = groupId;
  const el = document.getElementById('fileInput');
  el.value = '';
  el.click();
}

document.getElementById('fileInput').addEventListener('change', (e) => {
  const files = Array.from(e.target.files);
  if (!files.length || !activeGroupId) return;
  loadImages(files, activeGroupId);
});

async function loadImages(files, groupId) {
  const g = groups.find(g => g.id === groupId);
  if (!g) return;

  const promises = files.filter(f => f.type.startsWith('image/')).map(file =>
    new Promise(resolve => {
      const reader = new FileReader();
      reader.onload = e => {
        const dataUrl = e.target.result;
        const img = new Image();
        img.onload = () => resolve({
          id: 'img_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
          dataUrl,
          w: img.naturalWidth,
          h: img.naturalHeight,
          name: file.name
        });
        img.onerror = () => resolve(null);
        img.src = dataUrl;
      };
      reader.readAsDataURL(file);
    })
  );

  const loaded = (await Promise.all(promises)).filter(Boolean);
  g.images.push(...loaded);
  renderSidebar();
  renderPreview();
  updateStats();
}

// ═══════════════════════════════════════════
//  JUSTIFIED LAYOUT ALGORITHM
//  - Respeta maxPerRow por preset (evita que L se comprima)
//  - SIEMPRE estira todas las filas, incluso la última
//    (comportamiento de collage, no de galería)
// ═══════════════════════════════════════════
function justifiedLayout(images, containerWidth, targetRowHeight, maxPerRow) {
  if (!images.length) return [];

  const rows = [];
  let row = []; // [{img, w}]

  const rowRenderedWidth = (items) =>
    items.reduce((s, r) => s + r.w, 0) + GAP * Math.max(0, items.length - 1);

  const sealRow = (items) => {
    if (!items.length) return;
    const gaps = GAP * (items.length - 1);
    const imgOnlyW = items.reduce((s, r) => s + r.w, 0);
    const avail = containerWidth - gaps;
    const scale = avail / imgOnlyW;
    rows.push({
      items: items.map(r => ({ img: r.img, w: r.w * scale, h: targetRowHeight * scale })),
      h: targetRowHeight * scale
    });
  };

  for (const img of images) {
    if (!img.w || !img.h) continue;
    const ar = img.w / img.h;
    const imgW = targetRowHeight * ar;

    const tentative = [...row, { img, w: imgW }];
    const overflows = row.length > 0 && rowRenderedWidth(tentative) > containerWidth;
    const tooMany  = row.length >= (maxPerRow || 99);

    if (overflows || tooMany) {
      sealRow(row);
      row = [];
    }

    row.push({ img, w: imgW });
  }

  // Last row: also stretch to fill (collage, not gallery)
  sealRow(row);

  return rows;
}

// ═══════════════════════════════════════════
//  PAGE BUILDER
//  Returns: [{item, x, y}] por página
// ═══════════════════════════════════════════
function buildPages() {
  const pages = [];
  let page = [];
  let y = MARGIN;

  function newPage() {
    if (page.length) pages.push(page);
    page = [];
    y = MARGIN;
  }

  for (const group of groups) {
    if (!group.images.length) continue;
    const rowH = PRESETS[group.preset];
    const maxPerRow = MAX_PER_ROW[group.preset];
    const rows = justifiedLayout(group.images, USABLE_W, rowH, maxPerRow);

    for (let ri = 0; ri < rows.length; ri++) {
      const row = rows[ri];
      if (y + row.h > PDF.h - MARGIN) newPage();

      let x = MARGIN;
      for (const item of row.items) {
        page.push({ item, x, y });
        x += item.w + GAP;
      }
      y += row.h + GAP;
    }

    y += GROUP_GAP; // extra gap between groups
  }

  if (page.length) pages.push(page);
  return pages;
}

// ═══════════════════════════════════════════
//  PREVIEW RENDER
// ═══════════════════════════════════════════
function renderPreview() {
  const area = document.getElementById('previewArea');
  const empty = document.getElementById('previewEmpty');
  const hasImages = groups.some(g => g.images.length > 0);

  if (!hasImages) {
    area.innerHTML = '';
    area.appendChild(empty || createEmptyEl());
    document.getElementById('statPages').textContent = '—';
    return;
  }

  const pages = buildPages();
  document.getElementById('statPages').textContent = pages.length;

  // Scale preview to fit available width
  const areaW = area.clientWidth - 48;
  const PREVIEW_W = Math.min(Math.max(areaW, 300), 560);
  const scale = PREVIEW_W / PDF.w;
  const PREVIEW_H = PDF.h * scale;

  area.innerHTML = '';

  pages.forEach((pageItems, pi) => {
    const pageEl = document.createElement('div');
    pageEl.className = 'preview-page';
    pageEl.style.width = PREVIEW_W + 'px';
    pageEl.style.height = PREVIEW_H + 'px';

    pageItems.forEach(({ item, x, y }) => {
      const img = document.createElement('img');
      img.src = item.img.dataUrl;
      img.style.cssText = `
        position: absolute;
        left: ${(x * scale).toFixed(1)}px;
        top: ${(y * scale).toFixed(1)}px;
        width: ${(item.w * scale).toFixed(1)}px;
        height: ${(item.h * scale).toFixed(1)}px;
        object-fit: cover;
      `;
      pageEl.appendChild(img);
    });

    const num = document.createElement('div');
    num.className = 'preview-page-num';
    num.textContent = pi + 1 + ' / ' + pages.length;
    pageEl.appendChild(num);

    area.appendChild(pageEl);
  });
}

function createEmptyEl() {
  const el = document.createElement('div');
  el.id = 'previewEmpty';
  el.className = 'preview-empty';
  el.innerHTML = '<div class="icon">⬛</div><p>AGREGÁ IMÁGENES<br>A LOS GRUPOS<br>PARA PREVISUALIZAR</p>';
  return el;
}

// ═══════════════════════════════════════════
//  PDF EXPORT
// ═══════════════════════════════════════════
async function exportPDF() {
  const hasImages = groups.some(g => g.images.length > 0);
  if (!hasImages) { alert('Agregá imágenes antes de exportar.'); return; }

  const loader = document.getElementById('loader');
  loader.classList.add('active');

  await new Promise(r => setTimeout(r, 80));

  try {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: 'pt', format: 'a4', compress: true });
    const pages = buildPages();

    for (let pi = 0; pi < pages.length; pi++) {
      if (pi > 0) doc.addPage();
      for (const { item, x, y } of pages[pi]) {
        const fmt = item.img.dataUrl.includes('data:image/png') ? 'PNG' : 'JPEG';
        doc.addImage(item.img.dataUrl, fmt, x, y, item.w, item.h, undefined, 'FAST');
      }
    }

    const totalImages = groups.reduce((s, g) => s + g.images.length, 0);
    const filename = `collapdf_${totalImages}imgs_${pages.length}pag.pdf`;
    doc.save(filename);
  } catch (err) {
    console.error(err);
    alert('Error al generar PDF: ' + err.message);
  } finally {
    loader.classList.remove('active');
  }
}

// ═══════════════════════════════════════════
//  SIDEBAR RENDER
// ═══════════════════════════════════════════
function renderSidebar() {
  const list = document.getElementById('groupsList');

  list.innerHTML = groups.map(g => `
    <div class="group-card" id="card_${g.id}">
      <div class="group-header">
        <span class="group-drag-handle">⠿</span>
        <input class="group-name-input"
          value="${esc(g.name)}"
          onchange="renameGroup('${g.id}', this.value)"
          title="Renombrar grupo">
        <span class="group-count">${g.images.length}</span>
        <div class="preset-pills">
          ${['S','M','L'].map(p => `
            <button class="preset-pill ${g.preset === p ? 'active' : ''}"
              onclick="setPreset('${g.id}', '${p}')"
              title="${{S:'Pequeño',M:'Mediano (máx '+MAX_PER_ROW.M+')',L:'Grande (máx '+MAX_PER_ROW.L+')'}[p]}">
              ${p}
            </button>
          `).join('')}
        </div>
        <button class="btn-icon danger" onclick="removeGroup('${g.id}')" title="Eliminar grupo">✕</button>
      </div>

      <div class="group-thumbs">
        ${g.images.map(img => `
          <div class="thumb-wrap">
            <img src="${img.dataUrl}" title="${esc(img.name)}" loading="lazy">
            <button class="thumb-remove" onclick="removeImage('${g.id}', '${img.id}')">✕</button>
          </div>
        `).join('')}
      </div>

      <div class="drop-zone"
        onclick="openFilePicker('${g.id}')"
        ondragover="onDragOver(event, '${g.id}')"
        ondragleave="onDragLeave(event)"
        ondrop="onDrop(event, '${g.id}')">
        + AGREGAR IMÁGENES
      </div>
    </div>
  `).join('');

  // Mobile: show "Ver preview" button if there are images
  const hasImages = groups.some(g => g.images.length > 0);
  const existing = list.parentElement.querySelector('.preview-hint');
  if (existing) existing.remove();
  if (hasImages) {
    const hint = document.createElement('button');
    hint.className = 'preview-hint';
    hint.innerHTML = '◻ VER PREVIEW →';
    hint.onclick = () => switchTab('preview');
    list.parentElement.appendChild(hint);
  }
}

// ═══════════════════════════════════════════
//  DRAG & DROP
// ═══════════════════════════════════════════
function onDragOver(e, groupId) {
  e.preventDefault();
  e.stopPropagation();
  e.currentTarget.classList.add('drag-over');
}
function onDragLeave(e) {
  e.currentTarget.classList.remove('drag-over');
}
function onDrop(e, groupId) {
  e.preventDefault();
  e.stopPropagation();
  e.currentTarget.classList.remove('drag-over');
  const files = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/'));
  if (files.length) loadImages(files, groupId);
}

// ═══════════════════════════════════════════
//  MOBILE TAB NAVIGATION
// ═══════════════════════════════════════════
function switchTab(tab) {
  document.querySelectorAll('.mob-tab').forEach(t =>
    t.classList.toggle('active', t.dataset.tab === tab)
  );
  const sidebar = document.querySelector('.sidebar');
  const preview = document.querySelector('.preview-area');
  sidebar.classList.toggle('mob-hidden', tab !== 'sidebar');
  preview.classList.toggle('mob-hidden', tab !== 'preview');
  if (tab === 'preview') renderPreview();
}

// ═══════════════════════════════════════════
//  STATS
// ═══════════════════════════════════════════
function updateStats() {
  document.getElementById('statGroups').textContent = groups.length;
  const total = groups.reduce((s, g) => s + g.images.length, 0);
  document.getElementById('statImages').textContent = total;
}

// ═══════════════════════════════════════════
//  UTILS
// ═══════════════════════════════════════════
function esc(str) {
  return (str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Responsive preview on resize
window.addEventListener('resize', () => {
  if (groups.some(g => g.images.length > 0)) renderPreview();
});
</script>
